<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hetzner Manager</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
  --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #111114);
  --muted: var(--tg-theme-subtitle-text-color, var(--tg-theme-hint-color, #8a8a93));
  --hint: var(--tg-theme-hint-color, #8a8a93);
  --accent: var(--tg-theme-button-color, #2f7cf6);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, var(--accent));
  --header: var(--tg-theme-section-header-text-color, var(--muted));
  --danger: var(--tg-theme-destructive-text-color, #e5484d);
  --ok: #30a46c; --warn: #f5a524; --orange: #f76b15;
  --line: color-mix(in srgb, var(--text) 9%, transparent);
  --tint: color-mix(in srgb, var(--accent) 13%, transparent);
  --radius: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.grow { flex: 1; min-width: 0; } .nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { height: 8px; }

/* header */
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: flex-end; gap: 10px;
  padding: 14px 16px 10px; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); }
header .titles { flex: 1; min-width: 0; }
header h1 { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 13px; min-height: 18px; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--surface); color: var(--accent); box-shadow: var(--shadow); cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
main { padding: 4px 16px 16px; max-width: 760px; margin: 0 auto; }

/* tab bar */
nav#tabs { position: fixed; bottom: 0; inset-inline: 0; z-index: 10; display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 88%, transparent); border-top: 1px solid var(--line);
  backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); }
nav#tabs button { flex: 1; border: 0; background: none; color: var(--hint); padding: 4px 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; }
nav#tabs button svg { width: 24px; height: 24px; }
nav#tabs button.on { color: var(--accent); }

/* sections + rows */
.section { margin: 18px 0 0; }
.section > .head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px;
  color: var(--header); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.section > .head a { text-transform: none; letter-spacing: 0; color: var(--link); font-weight: 500; cursor: pointer; }
.section > .foot { padding: 6px 4px 0; color: var(--muted); font-size: 12.5px; }
.group { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.group > .item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 52px; position: relative; }
.group > .item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--line); }
.group > .item.tap { cursor: pointer; } .group > .item.tap:active { background: var(--line); }
.group > .item.col { flex-direction: column; align-items: stretch; gap: 8px; }
.group > .pad { padding: 14px; }
.item .title { font-weight: 600; } .item .sub { color: var(--muted); font-size: 13px; }
.item .right { color: var(--muted); font-size: 14px; white-space: nowrap; }
.chev { color: var(--hint); width: 16px; height: 16px; flex: none; }
.tile { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #fff; }
.tile svg { width: 18px; height: 18px; }
.t-blue { background: #2f7cf6; } .t-green { background: #30a46c; } .t-orange { background: #f76b15; }
.t-purple { background: #8e4ec6; } .t-red { background: #e5484d; } .t-gray { background: #8b8d98; }
.t-teal { background: #12a594; } .t-yellow { background: #e2a100; } .t-pink { background: #d6409f; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; }

/* stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; cursor: default; }
.stat.tap { cursor: pointer; } .stat.tap:active { transform: scale(.98); }
.stat .tile { margin-bottom: 10px; }
.stat .n { font-size: 24px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stat.wide { grid-column: 1 / -1; }

/* pills, badges */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px;
  border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.blue { background: var(--tint); color: var(--accent); }
.pill.red { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.pill.green { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.orange { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); flex: none; }
.dot.running { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.off { background: var(--danger); }

/* bars */
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--ok); transition: width .3s; }
.bar > i.w1 { background: var(--warn); } .bar > i.w2 { background: var(--orange); } .bar > i.w3 { background: var(--danger); }

/* server card */
.scard { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-top: 10px; cursor: pointer; }
.scard:active { transform: scale(.99); }
.scard .top { display: flex; align-items: center; gap: 8px; }
.scard .name { font-weight: 700; font-size: 16px; }
.scard .meta { color: var(--muted); font-size: 13px; margin: 3px 0 10px; }
.scard .foot { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 13px; color: var(--muted); }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 600; cursor: pointer;
  background: var(--accent); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn svg { width: 17px; height: 17px; }
.btn.block { width: 100%; }
.btn.tonal { background: var(--tint); color: var(--accent); }
.btn.plain { background: var(--line); color: var(--text); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger-tonal { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
.btn.sm { padding: 6px 11px; border-radius: 9px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:not(:disabled):active { filter: brightness(.92); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1; }
.link { color: var(--link); cursor: pointer; }

/* quick actions */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.qa { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text); }
.qa .tile { width: 36px; height: 36px; border-radius: 11px; }
.qa:disabled { opacity: .4; cursor: default; }
.qa:not(:disabled):active { transform: scale(.96); }

/* hero */
.hero { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: flex; gap: 16px; align-items: center; margin-top: 6px; }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring .v b { font-size: 20px; font-weight: 750; } .ring .v span { display: block; font-size: 11px; color: var(--muted); }

/* forms */
input[type=text], input[type=search], input[type=number], select {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid transparent; background: var(--bg); outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.search { position: relative; margin-top: 4px; }
.search input { padding-left: 38px; background: var(--surface); box-shadow: var(--shadow); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--hint); }
label.f { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
label.f:first-child { margin-top: 0; }
.seg { display: flex; background: var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 8px -16px 0; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { border: 0; border-radius: 99px; padding: 7px 13px; background: var(--surface); box-shadow: var(--shadow);
  font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--text); }
.group .chip { background: var(--bg); box-shadow: none; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.chip:disabled { opacity: .4; cursor: default; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .2s; cursor: pointer; }
.switch i::after { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: .2s; }
.switch input:checked + i { background: var(--ok); }
.switch input:checked + i::after { transform: translateX(20px); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hint); flex: none; display: grid; place-items: center; }
.radio.on { border-color: var(--accent); } .radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

/* code */
.code { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 8px 8px 8px 11px; }
.code .mono { flex: 1; min-width: 0; word-break: break-all; }
.copy { border: 0; background: var(--tint); color: var(--accent); border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; flex: none; }
.copy svg { width: 16px; height: 16px; }

/* sheet, toast */
#sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.38); display: flex; align-items: flex-end;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
#sheet.hidden { display: none; }
#sheet .box { background: var(--bg); width: 100%; max-height: 90vh; overflow: auto; border-radius: 22px 22px 0 0;
  padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); animation: up .22s ease-out; max-width: 760px; margin: 0 auto; }
#sheet .grab { width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
#sheet h3 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
#toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); inset-inline: 16px; z-index: 40; display: flex; justify-content: center; pointer-events: none; }
#toast span { background: rgba(28,28,30,.92); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: drop .2s ease-out; }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
pre.log { white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--surface);
  border-radius: 12px; padding: 12px; max-height: 42vh; overflow: auto; margin: 8px 0 0; }
details > summary { cursor: pointer; color: var(--link); font-weight: 600; list-style: none; padding: 4px 0; }
details > summary::-webkit-details-marker { display: none; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { height: 76px; border-radius: var(--radius); margin-top: 10px; background: linear-gradient(90deg, var(--surface) 25%, var(--line) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.plan.dim { opacity: .45; }
</style>
</head>

<header>
  <div class="titles"><div class="sub" id="subtitle"></div><h1 id="title">Hetzner</h1></div>
  <button class="iconbtn" id="reload" title="Refresh"></button>

<main id="view"><div class="skeleton"></div><div class="skeleton"></div></main>

  <button data-tab="more" data-icon="grid">More</button>
</nav>
<div id="sheet" class="hidden"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>

// ------------------------------------------------------------------ helpers
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false || kid === "") continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const iranHM = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit", hour12: false });
const isoDay = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tehran", year: "numeric", month: "2-digit", day: "2-digit" });
const when = (epoch) => epoch ? iranFmt.format(new Date(epoch * 1000)) : "";

function describe(s) {
  const at = hhmm(s.hour, s.minute);
  if (s.repeat === "d") return `Every day at ${at}`;
  if (s.repeat === "w") return `Every ${(WEEK.find((w) => w[0] === Number(s.day)) || [0, "?"])[1]} at ${at}`;
  if (s.repeat === "m") return `Monthly on day ${s.day} at ${at}`;
  const d = String(s.day);
  const date = new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), 12));

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": (tg && tg.initData) || "" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// A page's data: dropped (Stale) when a newer render started meanwhile, so a slow

async function load(path) {

  const data = await api("GET", path);
  if (seq !== S.seq) throw new Stale("stale");

const barCls = (f) => f >= 1 ? "w3" : f >= 0.85 ? "w2" : f >= 0.75 ? "w1" : "";

function ring(fraction, label) {

  const color = f >= 1 ? "var(--danger)" : f >= 0.85 ? "var(--orange)" : f >= 0.75 ? "var(--warn)" : "var(--ok)";
  const wrap = h("div", { class: "ring" });
  wrap.innerHTML = `<svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="9"/>` +
    `<circle cx="46" cy="46" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - Math.min(1, f))).toFixed(1)}"/></svg>`;

const TITLES = { dashboard: "Overview", servers: "Servers", create: "New server", alerts: "Alerts",

function updateBack() {

  const tab = S.tab;

    if (tab === "dashboard") await renderDashboard();
    else if (tab === "servers") await renderServers(true);
    else if (tab === "create") await renderCreate();
    else if (tab === "alerts") await renderAlerts();
    else if (tab === "more") renderMore();
    else if (tab === "cost") await renderCost();
    else if (tab === "snapshots") await renderSnapshots();
    else if (tab === "health") await renderHealth();
    else if (tab === "running") await renderRunning();
    else if (tab.startsWith("ips:")) await renderIps(tab.slice(4));
    else if (tab.startsWith("server:")) await renderServer(Number(tab.slice(7)));

function versionCard(current) {
  const body = h("div");
  const card = section("Bot", [
    item({ lead: tile("update", "gray"), title: "Version " + current, right: btn("Check for updates", check, "tonal sm") }),
    h("div", { class: "item col", style: "display:none" }, body)]);
  async function check() {
    body.parentNode.style.display = "";

    let v;
    try { v = await api("GET", "/api/version"); } catch (e) { body.replaceChildren(h("div", { class: "muted" }, "⚠️ " + e.message)); return; }
    const kids = [];
    if (v.error) kids.push(h("div", { class: "muted small" }, "⚠️ Could not check for a new version: ", h("span", { class: "mono" }, v.error)));
    else if (v.newer) kids.push(h("div", {}, h("b", {}, "New version " + v.latest)),

    else kids.push(h("div", { class: "muted" }, "✅ You are on the latest version."));
    kids.push(h("div", { class: "btnrow" },
      btn(v.newer ? `Update to ${v.latest}` : "Run the update again", () => run("update"), v.newer ? "" : "plain"),
      v.rollback && btn(`Roll back to ${v.rollback}`, () => run("rollback"), "plain")));

    } catch (e) { fail(e); }

}

async function renderServers(refetch) {
  if (refetch || !S.servers) S.servers = await load("/api/servers");

  const list = servers.filter((s) => (!F.account || s.account === F.account) && (!F.near || s.fraction >= warning));
  list.sort(F.sort === "traffic" ? (a, b) => b.fraction - a.fraction : (a, b) => a.name.localeCompare(b.name));
  const nearCount = servers.filter((s) => s.fraction >= warning).length;
  const search = h("input", { type: "search", placeholder: "Search name, IP or plan", value: F.q });
  search.addEventListener("input", () => { F.q = search.value; drawList(); });

  const listBox = h("div");

function watchItem(w, withServer) {

    lead: tile("bell", w.return ? "orange" : "purple"),

    right: btn("Cancel", async (e) => {
      e.stopPropagation();

function scheduleForm(s) {
  const st = { repeat: "m" };
  const day = h("select");
  const hour = h("select", {}, [...Array(24).keys()].map((x) => h("option", { value: x }, String(x).padStart(2, "0") + ":00")));
  const minute = h("select", {}, [...Array(12).keys()].map((x) => h("option", { value: x * 5 }, ":" + String(x * 5).padStart(2, "0"))));
  hour.value = "4";
  const segBox = h("div");
  function fill() {
    segBox.replaceChildren(seg(Object.entries(REPEAT), st.repeat, (v) => { st.repeat = v; fill(); }));
    let opts = [];
    if (st.repeat === "o") {
      for (let i = 0; i < 14; i++) {
        const d = new Date(Date.now() + i * 86400000);
        opts.push([isoDay.format(d).replaceAll("-", ""), (i === 0 ? "Today, " : i === 1 ? "Tomorrow, " : "") + iranDay.format(d)]);
      }
    } else if (st.repeat === "w") opts = WEEK.map(([n, name]) => [n, name]);
    else if (st.repeat === "m") opts = [...Array(31).keys()].map((x) => [x + 1, "Day " + (x + 1)]);
    day.replaceChildren(...opts.map(([v, t]) => h("option", { value: v }, t)));
    day.style.display = st.repeat === "d" ? "none" : "";
  }
  fill();
  return [h("div", { class: "small muted", style: "font-weight:600" }, "New schedule"), segBox,
    h("div", { class: "row" }, h("div", { class: "grow" }, day), h("div", { style: "width:92px" }, hour), h("div", { style: "width:78px" }, minute)),
    btn([icon("plus"), "Add schedule"], async () => {
      try {
        await api("POST", `/api/server/${s.id}/schedule`, { repeat: st.repeat, day: st.repeat === "d" ? 0 : day.value, hour: hour.value, minute: minute.value });
        haptic("success"); toast("Schedule added"); render();
      } catch (e) { fail(e); }
    }, "tonal block")];
}

async function doPower(s) {

}

async function doReset(s) {

function pickPlan(s, p) {
  const box = sheet();
  box.append(h("h3", {}, `Move to ${p.name}`), h("div", { class: "muted small" }, s.name));
  const rows = [];
  if (p.cores) rows.push(item({ title: `${p.cores} vCPU · ${num(p.memory)} GB · ${p.disk} GB disk`, sub: `Now ${eur(s.list_price)} / month`, right: eur(p.price) + " /mo" }));
  if (p.in_stock === false) rows.push(item({ lead: tile("fire", "orange"), title: "Hetzner says this plan is sold out here", sub: "It may still work; if refused, the server is powered back on unchanged." }));
  rows.push(item({ lead: tile("power", "gray"), title: "The server is off during the change", sub: "A grandfathered cheaper price is lost: the current list price applies." }));
  box.append(h("div", { class: "group", style: "margin-top:12px" }, rows));

  };

    btn("Change (CPU and RAM only)", () => go_(false), "block"),

    btn(p.watching ? "Stop the alert for this plan" : "🔔 Switch automatically when in stock", async () => {
      try { await api("POST", `/api/server/${s.id}/watch`, { plan: p.name, on: !p.watching }); closeSheet(); toast(p.watching ? "Alert cancelled" : "It will switch once the plan is back"); render(); } catch (e) { fail(e); }
    }, "plain block"),

// ------------------------------------------------------------------ sheet + jobs
function sheet() {
  const el = document.getElementById("sheet");
  const box = document.getElementById("sheetBox");
  box.replaceChildren(h("div", { class: "grab" })); el.classList.remove("hidden");
  return box;
}
function closeSheet() {
  document.getElementById("sheet").classList.add("hidden");
  clearTimeout(S.jobTimer); S.jobTimer = null;
}
document.getElementById("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") { closeSheet(); render(); } });

function secretSheet(title, secret, note) {
  const box = sheet();
  box.append(h("h3", {}, title));
  if (secret) box.append(h("div", { style: "margin-top:12px" }, codeBox(secret)));
  if (note) box.append(h("p", { class: "muted small" }, note));
  box.append(btn("Done", () => { closeSheet(); render(); }, "plain block", { style: "margin-top:12px" }));
}

async function showJob(id) {
  clearTimeout(S.jobTimer);
  let j;
  try { j = await api("GET", "/api/job/" + id); } catch (e) { fail(e); closeSheet(); return; }
  const box = sheet();
  box.append(h("h3", {}, j.done ? (j.ok ? "✅ " : "⚠️ ") : "", j.title));
  if (!j.done) {
    if (j.steps) box.append(h("div", { class: "muted small", style: "margin:10px 0 6px" }, `Step ${j.step} of ${j.steps} · ${j.stage}`), barEl(j.step / j.steps));
    else box.append(h("div", { class: "row muted", style: "margin-top:10px" }, h("span", { class: "spin" }), j.stage));
    if (j.logs.length) box.append(h("div", { class: "mono muted", style: "margin-top:8px" }, j.logs[j.logs.length - 1]));
    box.append(h("p", { class: "muted small" }, "You can close this; the result also comes in the bot chat."));
  } else box.append(jobResult(j));
  if (j.logs.length && j.done) box.append(h("details", { style: "margin-top:8px" }, h("summary", {}, "Full log"), h("pre", { class: "log" }, j.logs.join("\n"))));
  box.append(btn(j.done ? "Done" : "Close (keeps running)", () => { closeSheet(); render(); }, "plain block", { style: "margin-top:12px" }));
  if (!j.done) S.jobTimer = setTimeout(() => showJob(id), 1500);
  else haptic(j.ok ? "success" : "error");
}

function jobResult(j) {
  const r = j.result || {};
  if (j.kind === "reset") {
    const out = h("div", { style: "margin-top:8px" });
    if (r.before !== null && r.before !== undefined && r.reset)
      out.append(h("div", { class: "stat", style: "margin:8px 0" }, h("div", { class: "n" }, `${tb(r.before)} → ${tb(r.after)} TB`), h("div", { class: "l" }, "Traffic")));
    if (r.home) out.append(h("p", {}, `⚠️ The server is on ${r.plan}, not ${r.home}.`, r.reset ? " The traffic was reset, but there was no room to move back." : "",
      r.watching ? ` It moves back to ${r.home} by itself once the plan is in stock.` : ""));
    else out.append(h("p", {}, r.reset ? "✅ Traffic reset complete." : "❌ The reset did not happen; see the log."));
    if (r.text) out.append(h("p", {}, r.text));
    return out;
  }
  if (j.kind === "create" && r.servers) {
    const rows = r.servers.map((x) => item({
      lead: tile(x.ok ? "check" : "server", x.ok ? "green" : "red"),
      title: x.name,
      sub: x.ok ? [x.ip || "", x.password ? " · password " : "", x.password ? h("span", { class: "mono" }, x.password) : ""] : x.error,
      right: x.ok ? h("div", { class: "row", style: "gap:6px" }, x.ip && copyBtn(x.ip, "Copy IP"), x.password && copyBtn(x.password, "Copy password"),
        btn("Open", () => { closeSheet(); openServer(x.id); }, "tonal sm")) : undefined,
    }));
    const out = h("div", { style: "margin-top:12px" }, h("div", { class: "group" }, rows));
    if (r.servers.some((x) => x.password)) out.append(h("p", { class: "muted small" }, "Save the passwords now; they are not shown again (also sent to the bot chat)."));
    else if (r.keys) out.append(h("p", { class: "muted small" }, "The account's SSH keys were installed."));
    if (r.panel) out.append(h("p", {}, `🧩 Node setup started; the bot adds it to panel ${r.panel} when ready and tells you (5-10 min).`));
    return out;
  }
  if (j.kind === "ip" && j.ok) {
    const out = h("div", { style: "margin-top:12px" }, h("div", { class: "group" },
      item({ lead: tile("globe", "green"), title: r.new_ip, sub: `was ${r.old_ip}` + (r.kept ? " (kept)" : ""), right: copyBtn(r.new_ip, "Copy IP") })));
    out.append(h("p", { class: "muted small" }, "Update DNS records and anything else that used the old address."));
    return out;
  }
  return h("p", {}, r.text || (j.ok ? "Done" : "Failed"));
}

async function renderCreate(keep) {
  if (!keep || !S.create) {

                             S.create || {}, { opts, account: opts.account });
    const from = S.cloneFrom && opts.snapshots.find((x) => x.id === S.cloneFrom.id);
    if (from) Object.assign(S.create, { snap: from.id, image: String(from.id), category: from.arch === "arm" ? "cax" : "cx", plan: null });
    S.cloneFrom = null;
  }
  const C = S.create, O = C.opts;

    acc.value = C.account;
    acc.addEventListener("change", () => { C.account = acc.value; C.plan = null; renderCreate(); });
    kids.push(section("Account", pad(acc)));
  }
  if (snap) kids.push(section("", item({ lead: tile("clone", "purple"), title: "From snapshot " + snap.description,
    sub: `${snap.disk} GB disk · ${snap.arch}: plans too small for it are dimmed`,
    right: btn("Use an OS", () => { C.snap = null; C.image = null; renderCreate(true); }, "plain sm") })));
  kids.push(h("div", { class: "chips scroll" }, O.categories.map((c) =>
    h("button", { class: "chip" + (C.category === c.id ? " on" : ""), onclick: () => { C.category = c.id; C.plan = null; renderCreate(true); } }, c.label))));

  kids.push(section("Plan", O.plans.filter((p) => p.category === C.category).map((p) => {
    const where = p.in_stock.length ? p.in_stock : p.offered;
    const prices = where.map((l) => p.prices[l]).filter((x) => x);
    const low = prices.length ? Math.min(...prices) : null, high = prices.length ? Math.max(...prices) : null;
    const ok = fits(p);
    return item({
      cls: ok ? "" : "plan dim",
      lead: h("span", { class: "radio" + (C.plan === p.name ? " on" : "") }),
      title: [p.name, " ", p.stock_known ? (p.in_stock.length ? h("span", { class: "pill green" }, `${p.in_stock.length} in stock`) : h("span", { class: "pill red" }, "sold out")) : "",
        " ", !ok && h("span", { class: "pill" }, "too small")],
      sub: `${p.cores} vCPU · ${num(p.memory)} GB · ${p.disk} GB`,
      right: low === null ? "" : (high - low > 0.005 ? "from " : "") + eur(low),
      onclick: ok ? () => { C.plan = p.name; C.location = null; C.locs = []; C.alert = !p.in_stock.length; C.image = snap ? String(snap.id) : null; C.ipv4 = ""; renderCreate(true); } : null,
    });
  })));

  if (plan) {
    const soldOut = plan.offered.filter((l) => !plan.in_stock.includes(l));
    const locKids = [];
    if (soldOut.length || C.alert) locKids.push(pad(seg([["now", "Create now"], ["alert", "🔔 When in stock"]], C.alert ? "alert" : "now", (v) => {
      if (v === "now" && !plan.in_stock.length) return;
      C.alert = v === "alert"; C.locs = []; renderCreate(true);
    })));
    const lc = h("div", { class: "chips" });
    for (const l of O.locations.filter((l) => plan.offered.includes(l.name))) {

          (idx >= 0 ? `${idx + 1}. ` : "") + `${l.flag} ${l.city}` + (inStock ? " ✓" : "")));
      } else {
        lc.append(h("button", { class: "chip" + (C.location === l.name ? " on" : ""), disabled: !inStock,
          onclick: () => { C.location = l.name; C.ipv4 = ""; renderCreate(true); } }, `${l.flag} ${l.city}` + (price ? ` · ${eur(price)}` : "") + (inStock ? "" : " · sold out")));
      }

    kids.push(section(C.alert ? "Locations, in order of preference" : "Location", locKids));

    }
    if (!C.alert && O.panels.length && (C.image || "").startsWith("ubuntu"))

function autoResetSection(ar) {
  const save = (body, msg) => act(() => api("POST", "/api/auto-reset", body), msg);
  const hour = h("select", {}, [...Array(24).keys()].map((x) => h("option", { value: x }, String(x).padStart(2, "0"))));
  const minute = h("select", {}, ar.minutes.map((x) => h("option", { value: x }, ":" + String(x).padStart(2, "0"))));
  hour.value = String(ar.hour); minute.value = String(ar.minute);
  const onTime = () => save({ hour: hour.value, minute: minute.value }, "Time saved");
  hour.addEventListener("change", onTime); minute.addEventListener("change", onTime);
  const rows = [
    item({ lead: tile("moon", "purple"), title: "Auto reset",
      sub: ar.enabled ? `Every night at ${ar.time} (Iran) · next ${ar.next_text}` : "Off",
      right: switchEl(ar.enabled, (on) => save({ enabled: on }, on ? "Auto reset on" : "Auto reset off")) }),
    pad(h("div", { class: "row" }, h("div", { class: "small muted grow", style: "font-weight:600" }, "Time (Iran)"),
        h("div", { style: "width:78px" }, hour), h("div", { style: "width:78px" }, minute)),
      h("div", { class: "small muted", style: "font-weight:600" }, "Reset at"),
      seg(ar.thresholds.map((t) => [t, t + "%"]), ar.threshold, (t) => save({ threshold: t }, `Threshold ${t}%`))),
  ];
  for (const x of ar.servers) rows.push(item({
    lead: h("span", { class: "dot " + x.status }), title: x.name,
    sub: [pct(x.fraction) + " used" + (x.own_time ? ` · at ${x.time}` : "") + (x.status !== "running" ? " · powered off, skipped" : ""), barEl(x.fraction)],
    right: switchEl(x.included, (on) => act(() => api("POST", `/api/server/${x.id}/auto-reset`, { on }), on ? `${x.name}: on` : `${x.name}: off`)),
  }));
  return section("Auto reset", rows, { foot: `Each night the bot resets every running server that is switched on here and has used ${ar.threshold}% or more, or would pass 100% before the next night at the pace of the last 24 h. One after another; each is off for a few minutes, twice. The chat gets a message when it starts and the results.` });

function changeIpSheet(n) {
  const box = sheet();
  box.append(h("h3", {}, "Change IPv4"), h("div", { class: "muted small" }, `${n.name} · now ${n.ip}`));
  const choices = [{ key: "new0", title: "New IP, delete the old one", sub: "The usual choice" },
    { key: "new1", title: "New IP, keep the old one", sub: `The old one stays as a free primary IP` + (n.ip_price ? ` · ${eur(n.ip_price)}/mo` : "") },
    ...n.kept_ips.map((p) => ({ key: "pip" + p.id, title: `Use kept ${p.ip}`, sub: "The old one is deleted", id: p.id }))];
  let pick = "new0";
  const list = h("div", { class: "group", style: "margin-top:12px" });
  const draw = () => list.replaceChildren(...choices.map((c) => item({ lead: h("span", { class: "radio" + (c.key === pick ? " on" : "") }), title: c.title, sub: c.sub,
    onclick: () => { pick = c.key; draw(); } })));
  draw();
  box.append(list, h("p", { class: "muted small" }, "The server is powered off for about a minute. DNS records, clients" + (n.panel ? " and the node address in panel " + n.panel : "") + " must be changed to the new address."));
  box.append(h("div", { style: "display:grid;gap:8px;margin-top:6px" },
    btn([icon("swap"), "Change IPv4"], async () => {
      const c = choices.find((x) => x.key === pick);
      if (!(await confirmBox(`Give ${n.name} another IPv4? It is off for about a minute.`))) return;
      closeSheet();
      try {
        const j = await api("POST", `/api/server/${n.id}/ipv4`, { keep_old: pick === "new1", use_ip: c.id || null });
        showJob(j.id);
      } catch (e) { fail(e); }
    }, "block"),
    btn("Cancel", closeSheet, "plain block")));
}

  kids.push(section("Snapshots", sl));

  const img = h("select", {}, m.images.map((i) => h("option", { value: i.name }, i.description)));
  kids.push(section("Rebuild", pad(img, btn([icon("wrench"), "Rebuild OS"], async () => {
    if (!(await confirmBox(`🚨 Reinstall ${m.name} with ${img.value}? Everything on the server is erased.`))) return;
    try { const r = await api("POST", `/api/server/${id}/rebuild`, { image: img.value }); haptic("success");
          secretSheet("Rebuild started", r.password, r.password ? "New root password; save it now (also in the bot chat)." : "The account's SSH keys were installed; no password was made."); }
    catch (e) { fail(e); }
  }, "danger-tonal block", { disabled: m.busy || m.protected })), { foot: m.protected ? "🛡 Protection is on: turn it off above to rebuild." : "🚨 Erases all data and installs the OS from scratch." }));

  const confirmName = h("input", { type: "text", placeholder: m.name, autocapitalize: "off" });
  let keepIp = false;
  const del = btn([icon("trash"), "Delete server permanently"], async () => {
    if (!(await confirmBox(`Delete ${m.name} for good? This cannot be undone.` + (keepIp ? `\n${m.ip} is kept as a free primary IP.` : "")))) return;
    try {
      const r = await api("POST", `/api/server/${id}/delete`, { name: confirmName.value.trim(), keep_ip: keepIp });
      haptic("success"); toast(r.kept_ip ? `Server deleted; ${r.kept_ip} kept` : "Server deleted"); S.servers = null; go("servers");
    }
    catch (e) { fail(e); }
  }, "danger block", { disabled: true });
  confirmName.addEventListener("input", () => { del.disabled = m.busy || m.protected || confirmName.value.trim() !== m.name; });
  const dz = [];
  if (m.protected) dz.push(item({ lead: tile("lock", "green"), title: "Protection is on", sub: "Turn it off under Security to delete this server." }));
  if (m.ip) dz.push(item({ title: `Keep the IP ${m.ip}`, sub: "It stays as a free primary IP (billed monthly) for a new server in " + m.location,
    right: switchEl(false, (on) => { keepIp = on; }) }));
  dz.push(pad(h("div", { class: "small muted" }, "Type the server's name to confirm:"), confirmName, del));
  kids.push(section("Danger zone", dz));
  setView(...kids);
}

// ------------------------------------------------------------------ account-wide: cost
async function renderCost() {
  const c = await load("/api/cost");
  setTitle("Costs", "This month · " + c.month);
  const multi = c.accounts.length > 1;
  const kids = [];
  if (multi) kids.push(h("div", { class: "stats" }, h("div", { class: "stat wide" }, tile("wallet", "green"), h("div", { class: "n" }, eur(c.total)), h("div", { class: "l" }, "All accounts, this month"))));
  for (const a of c.accounts) {
    if (a.empty) { kids.push(section(multi ? a.account : "Servers", emptyItem("No servers (or the API did not answer)."))); continue; }
    kids.push(section(multi ? a.account + " · servers" : "Servers", a.servers.map((r) => item({
      title: [r.name, " ", h("span", { class: "pill" }, r.plan), r.backups ? " 💾" : ""],
      sub: `${tb(r.traffic)} / ${num(r.limit_tb)} TB` + (r.overage > 0 ? ` · ⚠️ ${eur(r.overage)} overage` : ""),
      right: eur(r.price), onclick: () => openServer(r.id), chevron: true,
    }))));
    const line = (ic, color, label, value) => item({ lead: tile(ic, color), title: label, right: value });
    kids.push(section(multi ? a.account + " · summary" : "Summary", [
      line("server", "blue", `Servers (${a.servers.length})`, eur(a.server_cost)),
      line("fire", "orange", "Traffic overage", eur(a.overage)),
      line("shield", "teal", `Backups (${a.backup_count})`, eur(a.backup_cost)),
      line("camera", "purple", `Snapshots (${a.snapshot_count}, ${gb(a.snapshot_gb)})`, eur(a.snapshot_cost)),
      line("disk", "gray", `Volumes (${a.volume_count}, ${gb(a.volume_gb)})`, eur(a.volume_cost)),
      line("globe", "teal", `Floating IPs (${a.floating_count})`, eur(a.floating_cost)),
      line("pin", "blue", `Primary IPs (${a.primary_assigned} on servers` + (a.primary_unassigned ? `, ${a.primary_unassigned} free` : "") + ")", eur(a.primary_cost)),
      item({ title: h("b", {}, "Total"), right: h("b", { style: "font-size:17px;color:var(--text)" }, eur(a.total)) }),
    ], { foot: [a.overage > 0 ? `Projected month-end overage ≈ ${eur(a.projected_overage)}. ` : "", `All-time overage loss ${eur(a.overage_all_time)}.`] }));
    if (a.history.length > 1) kids.push(section("Previous months", a.history.map(([m, v]) => item({ title: m, right: eur(v) }))));
  }
  kids.push(h("div", { class: "section foot muted small", style: "padding:0 4px" }, "Monthly prices incl. VAT (gross); custom server prices are used."));
  setView(...kids);
}

// ------------------------------------------------------------------ account-wide: IPs
async function renderIps(kind) {
  const d = await load("/api/ips/" + kind);
  const fip = kind === "fip";
  const multi = d.accounts.length > 1;
  const total = d.ips.reduce((x, i) => x + i.price, 0);
  setTitle(fip ? "Floating IPs" : "Primary IPs", `${plural(d.ips.length, "IP")} · ${eur(total)}/mo`);
  const kids = [];
  const F = S.ipForm = Object.assign({ account: d.accounts[0], type: "ipv4", location: (d.locations[0] || {}).name, count: 1 }, S.ipForm || {});
  if (!d.accounts.includes(F.account)) F.account = d.accounts[0];

  const rows = d.ips.map((ip) => {
    const top = [tile(fip ? "globe" : "pin", ip.server_id ? "green" : "gray"),
      h("div", { class: "grow" }, h("div", { class: "title mono", style: "font-size:14px;font-weight:600;word-break:break-all" }, ip.ip),
        h("div", { class: "sub" }, `${ip.flag} ${ip.location} · ${ip.type}`, multi ? " · " + ip.account : "", " · ",
          ip.server_id ? h("span", { class: "link", onclick: () => openServer(ip.server_id) }, ip.server_name || "#" + ip.server_id) : "unassigned",
          ip.price ? ` · ${eur(ip.price)}/mo` : (fip ? "" : " · free on a server"))),
      copyBtn(ip.ip),
      h("button", { class: "copy", title: "Delete", style: "background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)", onclick: async () => {
        if (fip) return deleteFip(ip, `/api/ips/fip/${encodeURIComponent(ip.account)}/${ip.id}`);
        if (!(await confirmBox(`Delete ${ip.ip}? This cannot be undone.` + (ip.server_id ? "\nA primary IP on a server cannot be deleted." : "")))) return;
        act(() => api("DELETE", `/api/ips/${kind}/${encodeURIComponent(ip.account)}/${ip.id}`), "Deleted");
      } }, icon("trash"))];
    const kidsCol = [h("div", { class: "row" }, top)];
    if (fip) {
      const sel = h("select", {}, h("option", { value: "" }, "Not attached"),
        d.servers.filter((s) => s.account === ip.account).map((s) => h("option", { value: s.id }, "Attached to " + s.name)));
      sel.value = ip.server_id || "";
      sel.addEventListener("change", async () => {
        const target = sel.value ? d.servers.find((s) => String(s.id) === sel.value) : null;
        if (!(await confirmBox(target ? `Attach ${ip.ip} to ${target.name}?` : `Detach ${ip.ip} from ${ip.server_name}?`))) { sel.value = ip.server_id || ""; return; }
        act(() => api("POST", `/api/ips/fip/${encodeURIComponent(ip.account)}/${ip.id}/assign`, { server_id: target ? target.id : null }),
          target ? "Attached; run its command on the server" : "Detached");
      });
      kidsCol.push(sel);
      if (ip.server_id) kidsCol.push(codeBox(ip.command));
    }
    return h("div", { class: "item col" }, kidsCol);
  });
  if (!d.ips.length) rows.push(emptyItem("No IPs yet."));
  kids.push(section(fip ? "Floating IPs" : "Primary IPs", rows, { foot: fip && d.ips.some((i) => i.server_id) ? FIP_HINT : "" }));

  const acc = multi && h("select", {}, d.accounts.map((a) => h("option", { value: a }, a)));
  if (acc) { acc.value = F.account; acc.addEventListener("change", () => { F.account = acc.value; }); }
  const loc = h("select", {}, d.locations.map((l) => h("option", { value: l.name }, `${l.flag} ${l.city}`)));
  loc.value = F.location; loc.addEventListener("change", () => { F.location = loc.value; });
  kids.push(section("Create", pad(
    acc ? [h("label", { class: "f" }, "Account"), acc] : "",
    h("label", { class: "f" }, "Type"), seg([["ipv4", "IPv4"], ["ipv6", "IPv6"]], F.type, (v) => { F.type = v; renderIps(kind); }),
    h("label", { class: "f" }, "Location"), loc,
    h("label", { class: "f" }, "Count"), seg([1, 2, 3, 5].filter((n) => n <= d.max_count).map((n) => [n, String(n)]), F.count, (v) => { F.count = v; renderIps(kind); }),
    h("div", { class: "spacer" }),
    btn([icon("plus"), "Create"], async () => {
      if (!(await confirmBox(`Create ${F.count} ${fip ? "floating" : "primary"} ${F.type === "ipv4" ? "IPv4" : "IPv6"} in ${F.location}? Billed monthly.`))) return;
      try {
        const r = await api("POST", "/api/ips/" + kind, { account: F.account, type: F.type, location: F.location, count: F.count });
        haptic(r.ok ? "success" : "warning");
        const box = sheet();
        box.append(h("h3", {}, `✅ Created ${r.made.length}` + (r.errors.length ? `, ${r.errors.length} failed` : "")));
        box.append(h("div", { class: "group", style: "margin-top:12px" }, r.made.map((x) => h("div", { class: "item col" },
          h("div", { class: "row" }, h("b", { class: "grow mono" }, x.ip), copyBtn(x.ip)), x.command ? codeBox(x.command) : ""))));
        for (const e of r.errors) box.append(h("p", { class: "muted small" }, "❌ " + e));
        if (fip) box.append(h("p", { class: "muted small" }, "Attach it to a server, then run its command on that server."));
        box.append(btn("Done", () => { closeSheet(); render(); }, "plain block", { style: "margin-top:12px" }));
      } catch (e) { fail(e); }
    }, "block"))));
  setView(...kids);
}

// ------------------------------------------------------------------ account-wide: snapshots
async function renderSnapshots() {
  const d = await load("/api/snapshots");
  const multi = d.accounts.length > 1;
  const size = d.snapshots.reduce((x, i) => x + i.size, 0), cost = d.snapshots.reduce((x, i) => x + i.price, 0);
  setTitle("Snapshots", `${plural(d.snapshots.length, "snapshot")} · ${gb(size)} · ${eur(cost)}/mo`);
  const pick = h("select", {}, d.servers.map((s) => h("option", { value: s.id }, s.name + (multi ? ` (${s.account})` : ""))));
  const rows = d.snapshots.map((x) => snapItem(x, { server: true, account: multi, clone: true }));
  if (!d.snapshots.length) rows.push(emptyItem("No snapshots yet."));
  setView(
    section("Take a snapshot", pad(pick, btn([icon("camera"), "Take snapshot"], async () => {
      const s = d.servers.find((x) => String(x.id) === pick.value);
      if (!s || !(await confirmBox(`Take a snapshot of ${s.name}? The server keeps running.`))) return;
      act(() => api("POST", `/api/server/${s.id}/snapshot`), "Snapshot started");
    }, "tonal block", { disabled: !d.servers.length }))),
    section("All snapshots", rows));
}

// ------------------------------------------------------------------ start
if (!tg || !tg.initData) {
  setTitle("Hetzner Manager");
  setView(h("div", { class: "group", style: "margin-top:12px" }, emptyItem("Open this page from the Telegram bot (the Panel button).")));
  document.getElementById("tabs").style.display = "none";
} else {
  go("dashboard");
}
</script>
</body>
</html>
